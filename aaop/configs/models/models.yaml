tiers:
  fast:
    models:
      - groq/llama-3.1-8b-instant       # free, ~750 tok/s
      - groq/gemma2-9b-it                # free fallback
    pricing:
      groq/llama-3.1-8b-instant:
        input_per_1m: 0.05
        output_per_1m: 0.08
      groq/gemma2-9b-it:
        input_per_1m: 0.20
        output_per_1m: 0.20

  balanced:
    models:
      - groq/llama-3.3-70b-versatile    # free, best quality on Groq
      - groq/llama-3.1-8b-instant       # free fallback (fast, still good)
      - claude-sonnet-4-6               # paid fallback (Anthropic)
    pricing:
      groq/llama-3.3-70b-versatile:
        input_per_1m: 0.59
        output_per_1m: 0.79
      groq/llama-3.1-8b-instant:
        input_per_1m: 0.05
        output_per_1m: 0.08
      claude-sonnet-4-6:
        input_per_1m: 3.00
        output_per_1m: 15.00

  powerful:
    models:
      - groq/llama-3.3-70b-versatile    # Groq's best (free tier)
      - claude-opus-4-7                 # paid fallback (Anthropic)
    pricing:
      groq/llama-3.3-70b-versatile:
        input_per_1m: 0.59
        output_per_1m: 0.79
      claude-opus-4-7:
        input_per_1m: 15.00
        output_per_1m: 75.00

defaults:
  tier: balanced
  retry_attempts: 3
  retry_wait_min: 1
  retry_wait_max: 10
