[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E402"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

# files outside the core engine are not type-checked strictly
exclude = ["__main__.py", "demo/", "run_agent.py", "tools/", "ui/", "api/", "db/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
