name: Reusable Compare Catalog

on:
  workflow_call:

permissions:
  contents: read

jobs:
  compare-catalog:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          cache: pip
          python-version: "3.10"

      - name: Install dependencies
        working-directory: aaop
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compare catalog
        working-directory: aaop
        run: python tools/testing/compare_catalog.py
