name: Reusable QA

on:
  workflow_call:
    secrets:
      ANTHROPIC_API_KEY:
        required: false
      GROQ_API_KEY:
        required: false
      OPENAI_API_KEY:
        required: false

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          cache: pip
          python-version: "3.10"

      - name: Install dependencies
        working-directory: aaop
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Unit tests
        working-directory: aaop
        env:
          AAOP_ENV: dev
          ANTHROPIC_API_KEY: test-key-ci
          GROQ_API_KEY: test-key-ci
          OPENAI_API_KEY: test-key-ci
        run: pytest tests/unit/ -v

      - name: Validate agents
        working-directory: aaop
        run: python tools/testing/validate_agents.py

