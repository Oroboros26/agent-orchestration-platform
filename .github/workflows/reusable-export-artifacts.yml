name: Reusable Export Artifacts

on:
  workflow_call:

permissions:
  contents: read

jobs:
  export-artifacts:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          cache: pip
          python-version: "3.10"

      - name: Install dependencies
        working-directory: aaop
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Generate artifact bundle
        working-directory: aaop
        env:
          AAOP_ENV: dev
          ANTHROPIC_API_KEY: test-key-ci
          GROQ_API_KEY: test-key-ci
          OPENAI_API_KEY: test-key-ci
        run: |
          mkdir -p artifacts
          python tools/testing/compare_catalog.py --output artifacts/catalog-comparison.md
          python tools/testing/generate_release_notes.py --output artifacts/release-notes-preview.md
          python tools/testing/validate_agents.py > artifacts/agent-validation.txt
          pytest tests/unit/ -v > artifacts/unit-tests.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4.4.3
        with:
          name: aaop-ci-artifacts
          path: aaop/artifacts/
          if-no-files-found: error
